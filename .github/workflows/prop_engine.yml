name: NBA Prop Engine

on:
  schedule:
    - cron: "0 14 * * *"   # Runs daily at 14:00 UTC (adjust if needed)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT → allows rebase to work

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Prop Engine
        run: |
          python main.py

      # ==========================
      # SAFE COMMIT + PUSH BLOCK
      # ==========================

      - name: Commit and push report safely
        run: |
          git config user.name "prop-engine-bot"
          git config user.email "bot@users.noreply.github.com"

          git add reports/

          # Only commit if something actually changed
          if ! git diff --cached --quiet; then
            git commit -m "Daily prop report"
          else
            echo "No changes to commit"
          fi

          # Pull remote changes safely
          git pull --rebase origin main

          # Push updates
          git push origin main
