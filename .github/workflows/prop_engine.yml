name: NBA Prop Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Prop Engine
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python prop_engine_full_slate_C.py

      # ✅ CRITICAL FIX
      - name: Pull latest changes
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git pull origin main --rebase

      - name: Save Report
        run: |
          git add reports/latest.txt
          git commit -m "Daily prop report" || echo "No changes to commit"
          git push origin main
