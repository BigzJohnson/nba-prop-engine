name: NBA Prop Engine

on:
  schedule:
    - cron: '0 15 * * *'   # Runs daily at 15:00 UTC (9AM CST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-prop-engine:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Prop Engine
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python prop_engine_full_slate_C.py

      # ✅ FIXED SAVE REPORT STEP
      - name: Save Report
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"

          git add reports/latest.txt

          git commit -m "Daily prop report" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin main
