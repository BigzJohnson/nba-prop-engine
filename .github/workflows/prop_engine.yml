name: NBA Prop Engine

on:
  schedule:
    - cron: "0 14 * * *"   # daily 14:00 UTC
  workflow_dispatch:

# Prevent overlapping runs (this is a HUGE reason push conflicts happen)
concurrency:
  group: nba-prop-engine
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Prop Engine
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python prop_engine_full_slate_C.py

      # ==========================
      # SAFE COMMIT + PUSH (FIXED)
      # ==========================
      - name: Save Report (safe rebase + push)
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull/rebase first so we don't get "fetch first"
          git fetch origin main
          git rebase origin/main || (git rebase --abort && git pull --rebase origin main)

          # Add reports
          git add reports/latest.txt

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily prop report"

          # Push
          git push origin HEAD:main
