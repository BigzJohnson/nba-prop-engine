name: NBA Prop Engine

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run Prop Engine
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python prop_engine_full_slate_C.py

      - name: Save Report
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add reports/latest.txt
          git commit -m "Daily prop report" || echo "No changes"
          git push
