name: NBA Prop Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-prop-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Prop Engine
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python prop_engine_full_slate_C.py

      - name: Save Report
        run: |
          git config user.name "prop-bot"
          git config user.email "prop-bot@users.noreply.github.com"

          git add reports/latest.txt

          git commit -m "Daily prop report" || echo "No changes"

          git pull origin main
          git push --force-with-lease
