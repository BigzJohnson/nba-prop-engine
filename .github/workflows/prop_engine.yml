name: NBA Prop Engine

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-prop-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Prop Engine
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python prop_engine_full_slate_C.py

      # ⭐ IMPORTANT FIX BELOW ⭐
      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Save Report
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add reports/latest.txt
          git commit -m "Daily prop report" || echo "No changes"
          git push
