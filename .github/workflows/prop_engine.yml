- name: Sync, Commit, Push Report
        run: |
          set -e

          git config user.name "bot"
          git config user.email "bot@github.com"

          test -f reports/latest.txt

          git fetch origin main
          git rebase origin/main || git rebase --abort

          git add reports/latest.txt
          git commit -m "Daily prop report" || echo "No changes to commit"

          git push origin main
