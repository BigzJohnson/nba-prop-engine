name: NBA Prop Engine

on:
  schedule:
    - cron: "0 10 * * *"   # Runs 4AM CST (safe early run)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ⭐ PULL FIRST (Fixes your rebase error)
      - name: Sync repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Run Prop Engine
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python prop_engine_free.py

      # ⭐ SAFE COMMIT BLOCK
      - name: Commit and push report
        run: |
          git add reports/latest.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily prop report"
          git push origin main
