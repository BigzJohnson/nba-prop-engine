name: NBA Prop Engine

on:
  schedule:
    - cron: '0 12 * * *'   # Runs daily at 6 AM CST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

    # ---------------------------
    # Checkout Repo
    # ---------------------------
    - name: Checkout Repo
      uses: actions/checkout@v4

    # ---------------------------
    # Setup Python
    # ---------------------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # ---------------------------
    # Install Dependencies
    # ---------------------------
    - name: Install Dependencies
      run: pip install requests

    # ---------------------------
    # Pull Latest Repo (FIRST SYNC)
    # ---------------------------
    - name: Pull Latest Changes
      run: git pull origin main --rebase

    # ---------------------------
    # Run Prop Engine Script
    # ---------------------------
    - name: Run Prop Engine
      env:
        BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      run: python prop_engine_full_slate_C.py

    # ---------------------------
    # Commit & Push Report (FINAL FIX)
    # ---------------------------
    - name: Commit & Push Report
      run: |
        git config user.name "bot"
        git config user.email "bot@github.com"

        git add reports/latest.txt
        git commit -m "Daily prop report" || echo "No changes"

        # ⭐ CRITICAL SECOND PULL (FIXES YOUR ERROR)
        git pull origin main --rebase

        git push origin main
