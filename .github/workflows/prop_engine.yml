name: NBA Prop Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: nba-prop-engine
  cancel-in-progress: true

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Prop Engine
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python prop_engine_full_slate_C.py

      - name: Commit and Push Report
        run: |
          set -e

          git config user.name "bot"
          git config user.email "bot@github.com"

          test -f reports/latest.txt

          git fetch origin main
          git rebase origin/main || git rebase --abort

          git add reports/latest.txt
          git commit -m "Daily prop report" || echo "No changes"

          git push origin main
